# XcodeGen: xcodegen generate → HashBench.xcodeproj
# Замеры — те же C++ файлы, что на Xeon и Mac; у каждого main переименован флагом -Dmain=…
name: HashBench
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    GCC_OPTIMIZATION_LEVEL: "3"
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "NDEBUG=1"]
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  HashBench:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../dedup_bench.cpp
        compilerFlags: "-Dmain=dedup_main"
      - path: ../mac/probe.cpp
        compilerFlags: "-Dmain=probe_main"
      - path: ../mac/mlp.cpp
        compilerFlags: "-Dmain=mlp_main"
      - path: ../mac/sortfam.cpp
        compilerFlags: "-Dmain=sortfam_main"
      - path: ../mac/alloc.cpp
        compilerFlags: "-Dmain=alloc_main"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nagornov.hashbench
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/build/abseil-cpp"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/build"]
        OTHER_LDFLAGS: ["$(inherited)", "-labsl_ios", "-framework", "CoreFoundation"]
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: HashBench-Info.plist
      properties:
        CFBundleDisplayName: HashBench
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: SceneDelegate
schemes:
  HashBench:
    build:
      targets:
        HashBench: all
    run:
      config: Release
    archive:
      config: Release
